name: ui-tests

# Suite browser terpisah dari edisi harian (DEC-0013): tes browser yang rapuh
# tidak boleh menggagalkan penerbitan edisi pagi.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "tests/**"
      - "tests-ui/**"
      - "fixtures/ui/**"
      - "scripts/serve.ts"
      - "scripts/prepare-ui-fixture.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - name: Unit test (lapisan tanpa browser)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Suite browser
        run: npm run test:ui

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
