name: edisi-harian

on:
  schedule:
    # 22:45 UTC = 05:45 WIB. Cron GitHub memakai UTC; WIB tidak punya DST.
    - cron: "45 22 * * *"
  workflow_dispatch:

concurrency:
  group: edisi-harian
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DATABASE_PATH: data/state/local.db
      # CI memakai DeepSeek: opencode CLI tidak terpasang di runner.
      # Jangan set OPENCODE_BIN ke path lokal macOS.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # State (artikel, registry, adjudikasi, langganan push) harus bertahan
      # antar-run; tanpa ini rekap mingguan dan deep dive 7 hari selalu kosong.
      # Cache bergulir: kunci unik per run, restore memakai kecocokan awalan.
      - name: Pulihkan state
        uses: actions/cache@v4
        with:
          path: data/state
          key: edisi-state-${{ github.run_id }}
          restore-keys: |
            edisi-state-

      - run: npm ci

      - name: Cek state
        run: npm run state:info

      - name: Migrasi state
        run: npm run migrate

      - name: Ambil berita
        run: npm run ingest -- --since-hours 36

      - name: Bangun edisi harian
        run: npm run build -- --thin

      - name: Bangun edisi mingguan (Minggu)
        run: |
          if [ "$(TZ=Asia/Jakarta date +%u)" = "7" ]; then
            npm run weekly -- --thin
          else
            echo "bukan Minggu, mingguan dilewati"
          fi

      - name: Publikasikan
        run: npm run publish

      - name: Kirim notifikasi
        if: ${{ env.PUSH_SUBSCRIPTIONS != '' }}
        run: npm run push

      # Commit adalah cadangan, bukan syarat deploy. Kalau ada push manusia
      # saat run berjalan, jangan sampai artefak situs ikut batal.
      - name: Simpan hasil
        continue-on-error: true
        run: |
          git config user.name "edisi-pagi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data public
          if git diff --cached --quiet; then
            echo "tidak ada perubahan"
            exit 0
          fi
          git commit -m "edisi $(TZ=Asia/Jakarta date +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "hasil tersimpan"
              exit 0
            fi
            echo "push gagal, coba lagi ($i/3)"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "gagal menyimpan hasil; artefak situs tetap dideploy"
          exit 0

      - name: Unggah artefak situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
