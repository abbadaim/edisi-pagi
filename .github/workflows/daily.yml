name: edisi-harian

on:
  schedule:
    # Tiga jendela, bukan satu: cron GitHub bisa membuang trigger tanpa
    # mengubah status workflow (DEC-0028, terjadi lagi 2026-11-17). Run kedua
    # dan ketiga langsung berhenti di penjaga idempoten bila edisi sudah ada.
    - cron: "45 22 * * *"   # 05:45 WIB
    - cron: "30 0 * * *"    # 07:30 WIB
    - cron: "30 2 * * *"    # 09:30 WIB
  workflow_dispatch:

concurrency:
  group: edisi-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apakah edisi hari ini sudah ada?
        id: guard
        run: node scripts/edition-guard.ts

  build:
    needs: check
    # Jendela cron kedua/ketiga tidak boleh menimpa edisi yang sudah terbit.
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      DATABASE_PATH: data/state/local.db
      # DEC-0016: DeepSeek API langsung tidak dipakai (biaya per token di saldo
      # pribadi). OpenCode satu-satunya penyedia; tanpa itu penulis deterministik.
      # Jangan tambahkan kembali DEEPSEEK_API_KEY tanpa mengubah DEC-0016.
      LLM_PROVIDER: opencode
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
      OPENCODE_MODEL: opencode-go/deepseek-v4.1-flash
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # State (artikel, registry, adjudikasi, langganan push) harus bertahan
      # antar-run; tanpa ini rekap mingguan dan deep dive 7 hari selalu kosong.
      # Cache bergulir: kunci unik per run, restore memakai kecocokan awalan.
      - name: Pulihkan state
        uses: actions/cache@v4
        with:
          path: data/state
          key: edisi-state-${{ github.run_id }}
          restore-keys: |
            edisi-state-

      - run: npm ci

      # OpenCode di CI bersifat opsional. Jangan pernah menggagalkan deploy
      # karena installer/versi CLI berbeda; DeepSeek selalu jadi cadangan.
      # Versi dipatok. 2026-11-15/16 memasang v2.3.0 dan katalog `opencode
      # models` tidak lagi memuat opencode-go/deepseek-v4.1-flash, sehingga
      # DEC-0018 mematikan OpenCode dan penulis deterministik yang jalan.
      # Edisi 2026-11-16 hanya berisi satu kartu hoaks karena ini.
      - name: Install OpenCode CLI
        if: env.OPENCODE_AUTH_JSON != ''
        run: |
          if ! curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.2.7; then
            echo "::warning::OpenCode gagal dipasang; build memakai penulis deterministik"
            echo "OPENCODE_BIN=/nonexistent" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version || true

      - name: Import OpenCode credentials
        if: env.OPENCODE_AUTH_JSON != ''
        run: |
          if printf '%s' "$OPENCODE_AUTH_JSON" | "$HOME/.opencode/bin/opencode" --standalone auth import; then
            "$HOME/.opencode/bin/opencode" --standalone auth list || true
            echo "OpenCode siap"
          else
            echo "::warning::auth import gagal (versi CLI?); build memakai penulis deterministik"
            echo "OPENCODE_BIN=/nonexistent" >> "$GITHUB_ENV"
          fi

      # Pantau pembaca (rencana 022). Fail-soft: Supabase yang tidak terjangkau
      # tidak boleh menggagalkan edisi; skrip menangani kegagalan sendiri.
      - name: Sinkronkan pantau pembaca
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/watch.ts sync

      - name: Cek state
        run: npm run state:info

      - name: Migrasi state
        run: npm run migrate

      - name: Ambil berita
        run: npm run ingest -- --since-hours 36

      - name: Bangun edisi harian
        run: npm run build -- --thin

      # Rekap mingguan punya workflow sendiri (`weekly.yml`) supaya tidak
      # bergantung pada build harian dan tidak menimpa edisi harian.
      - name: Publikasikan
        run: npm run publish

      # Build bisa "sukses" tetapi turun mutu (penulis deterministik, satu kartu).
      # Langkah ini menilai hasilnya, bukan status job.
      # `--strict`: edisi yang tidak terbentuk memerahkan run, bukan hanya
      # mengirim surel (DEC-0038). Commit dan deploy otomatis dilewati.
      - name: Cek kesehatan build
        id: health
        if: always()
        run: node scripts/health.ts --strict --out /tmp/health.json

      - name: Kirim peringatan surel
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          ALERT_SMTP_URL: ${{ secrets.ALERT_SMTP_URL }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: node scripts/alert.ts --input /tmp/health.json

      - name: Kirim notifikasi
        if: ${{ env.PUSH_SUBSCRIPTIONS != '' }}
        run: npm run push

      # Commit adalah cadangan, bukan syarat deploy. Kalau ada push manusia
      # saat run berjalan, jangan sampai artefak situs ikut batal.
      - name: Simpan hasil
        continue-on-error: true
        run: |
          git config user.name "edisi-pagi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data public
          if git diff --cached --quiet; then
            echo "tidak ada perubahan"
            exit 0
          fi
          git commit -m "edisi $(TZ=Asia/Jakarta date +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "hasil tersimpan"
              exit 0
            fi
            echo "push gagal, coba lagi ($i/3)"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "gagal menyimpan hasil; artefak situs tetap dideploy"
          exit 0

      - name: Laporkan hasil pantau
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/watch.ts report

      - name: Unggah artefak situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
