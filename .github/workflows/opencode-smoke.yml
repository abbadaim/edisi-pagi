name: opencode-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
      OPENCODE_MODEL: opencode-go/deepseek-v4.1-flash

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCode CLI
        run: |
          # Sama dengan daily.yml: versi dipatok supaya katalog model tidak
          # berubah diam-diam di tengah jalan (DEC-0018).
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.2.7
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Import credentials
        run: |
          test -n "$OPENCODE_AUTH_JSON"
          printf '%s' "$OPENCODE_AUTH_JSON" | "$HOME/.opencode/bin/opencode" --standalone auth import
          "$HOME/.opencode/bin/opencode" --standalone auth list

      - name: Call a model
        run: |
          "$HOME/.opencode/bin/opencode" --standalone run \
            --model "$OPENCODE_MODEL" \
            --format json \
            --auto \
            --archived \
            'Balas hanya JSON {"ok":true}' \
            | tee /tmp/opencode-smoke.json
          grep -q 'ok' /tmp/opencode-smoke.json

      # Probe rencana 022. Dipisah dari panggilan di atas supaya kegagalan
      # fitur yang belum ada tidak menyamar sebagai pipeline rusak — tetapi
      # tetap merah, karena fase 5 bergantung pada hasilnya.
      - name: Probe katalog model gratis (DEC-0018)
        run: |
          MODELS=$("$HOME/.opencode/bin/opencode" --standalone models)
          echo "$MODELS" | grep -qx 'opencode/deepseek-v4.1-flash-free' \
            || { echo "GAGAL: opencode/deepseek-v4.1-flash-free tidak ada di katalog profil CI"; exit 1; }
          echo "OK katalog: model gratis terlihat di profil CI"

      # Probe rencana 022. Advisory: hasilnya dicatat, bukan menggagalkan smoke.
      # Kegagalan ditangani DI DALAM skrip — `bash -e` akan mematikan job
      # sebelum bukti sempat dicetak.
      - name: Probe katalog model gratis (DEC-0018)
        run: |
          MODELS=$("$HOME/.opencode/bin/opencode" --standalone models)
          echo "$MODELS" | grep -qx 'opencode/deepseek-v4.1-flash-free' \
            || { echo "GAGAL: opencode/deepseek-v4.1-flash-free tidak ada di katalog profil CI"; exit 1; }
          echo "OK katalog: model gratis terlihat di profil CI"

      - name: Probe tool pencarian (rencana 022) — advisory
        run: |
          # Run 44006991360: websearch ada tetapi ditolak headless
          # ("Cancelled a request for input this run cannot answer").
          # Langkah ini memetakan apa yang benar-benar bisa dipakai CI.
          set +e
          "$HOME/.opencode/bin/opencode" --standalone run \
            --model 'opencode/deepseek-v4.1-flash-free#low' \
            --format json --auto --archived \
            'Pakai tool websearch untuk mencari satu berita terbaru tentang Kabupaten Sleman. Balas JSON {"url":"...","kutipan":"..."}' \
            > /tmp/p-websearch.json 2>&1
          echo "websearch exit=$?"
          "$HOME/.opencode/bin/opencode" --standalone run \
            --model 'opencode/deepseek-v4.1-flash-free#low' \
            --format json --auto --archived \
            'Pakai tool webfetch pada https://abbadaim.github.io/edisi-pagi/manifest.json lalu balas JSON {"ok":true,"latest":"<nilai latest>"}' \
            > /tmp/p-webfetch.json 2>&1
          echo "webfetch exit=$?"
          set -e

          python3 - <<'PY'
          import json

          for name in ("websearch", "webfetch"):
              path = f"/tmp/p-{name}.json"
              seen, ok, err = 0, 0, None
              try:
                  lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              except FileNotFoundError:
                  print(f"{name}: tidak ada keluaran")
                  continue
              for line in lines:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      e = json.loads(line)
                  except Exception:
                      continue
                  if e.get("type") == "tool_use" and e.get("part", {}).get("tool") == name:
                      seen += 1
                      state = e["part"].get("state") or {}
                      if state.get("status") == "completed":
                          ok += 1
                      else:
                          err = state.get("error") or err
                  if e.get("type") == "error":
                      err = (e.get("error") or {}).get("message") or err
              print(f"{name}: dipanggil {seen}x, berhasil {ok}x, catatan: {err}")
          PY
          echo "probe pencarian selesai — hasil dicatat, tidak menggagalkan smoke"
