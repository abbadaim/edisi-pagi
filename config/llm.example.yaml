# config/llm.yaml — salin ke config/llm.yaml lalu sesuaikan.
# Lihat INFRA.md §11 dan REQUIREMENTS.md §7.4.

capabilities:
  adjudicate:
    provider: deepseek          # deepseek | opencode
    model: deepseek-flash
  write:
    provider: deepseek
    model: deepseek-flash
  verify:
    provider: deepseek
    model: deepseek-v4-pro      # dipakai untuk blok truth & misread
  embed:
    provider: local             # deepseek TIDAK punya endpoint embedding
    model: Xenova/multilingual-e5-small

